<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFit - 会员中心</title>
<meta name="author" content="Jelly">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --sidebar-w: 220px;
    --sidebar-bg: #FFFFFF;
    --sidebar-hover: #F1F5F9;
    --sidebar-active: #EFF6FF;
    --sidebar-text: #64748B;
    --sidebar-text-active: #1E293B;
    --brand: #2563EB;
    --brand-hover: #1D4ED8;
    --brand-light: rgba(37,99,235,0.08);
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --border-light: #F1F5F9;
    --green: #10B981;
    --green-bg: #ECFDF5;
    --danger: #EF4444;
    --danger-bg: #FEF2F2;
    --warning: #F59E0B;
    --warning-bg: #FFFBEB;
    --blue: #3B82F6;
    --blue-bg: #EFF6FF;
    --radius: 14px;
    --radius-sm: 10px;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    --shadow-sm: 0 1px 2px rgba(37,99,235,0.03), inset 0 1px 0 rgba(255,255,255,0.9);
    --shadow: 0 1px 3px rgba(37,99,235,0.04), 0 4px 16px rgba(37,99,235,0.03), inset 0 1px 0 rgba(255,255,255,0.9);
    --shadow-md: 0 8px 32px rgba(37,99,235,0.06), 0 2px 6px rgba(37,99,235,0.04), inset 0 1px 0 rgba(255,255,255,0.9);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
  }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    z-index: 200;
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 24px 20px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-logo {
    width: 36px; height: 36px;
    background: var(--brand);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sidebar-logo svg { width: 20px; height: 20px; color: #fff; }

  .sidebar-brand-text {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .sidebar-brand-text em {
    font-style: normal;
    color: var(--brand);
  }

  .sidebar-nav {
    flex: 1;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-nav .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--sidebar-text);
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
  }

  .sidebar-nav .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .sidebar-nav .nav-item:hover {
    background: var(--sidebar-hover);
    color: var(--text);
  }

  .sidebar-nav .nav-item.active {
    background: var(--sidebar-active);
    color: var(--brand);
    font-weight: 600;
  }

  .sidebar-nav .nav-item.active svg { color: var(--brand); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border-light);
    margin: 0 12px 12px;
  }

  .sidebar-footer .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius-sm);
  }

  .user-avatar {
    width: 32px; height: 32px;
    background: var(--brand);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .user-avatar span { color: #fff; font-size: 13px; font-weight: 700; }

  .user-meta { flex: 1; min-width: 0; }
  .user-meta .uname { font-size: 13px; font-weight: 600; color: var(--text); }
  .user-meta .urole { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  /* ===== 主内容区 ===== */
  .main-wrap {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar .breadcrumb {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }

  .topbar .breadcrumb span { color: var(--text-muted); font-weight: 400; }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .vip-badge {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: rgba(37,99,235,0.08);
    color: var(--brand);
    border: 1px solid rgba(37,99,235,0.2);
  }

  .btn-logout {
    padding: 7px 16px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-logout:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: var(--danger-bg);
  }

  .content {
    flex: 1;
    padding: 24px 28px 40px;
    max-width: 1200px;
    width: 100%;
  }

  .page { display: none; }
  .page.active { display: block; animation: pageIn 0.6s var(--ease-out-expo); }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
  }

  .card-item {
    background: var(--surface);
    border: 1px solid rgba(37,99,235,0.05);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    transition: all 0.5s var(--ease-spring);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .card-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }

  .card-item.gold::before { background: var(--brand); }
  .card-item.orange::before { background: #F59E0B; }
  .card-item.blue::before { background: var(--blue); }
  .card-item.green::before { background: var(--green); }

  .card-item:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }

  .card-item .card-badge {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 4px;
  }

  .badge-hot {
    background: linear-gradient(135deg, #F97316, #DC2626);
    color: #fff;
  }

  .badge-value {
    background: var(--green-bg);
    color: #059669;
    border: 1px solid #A7F3D0;
  }

  .card-item .card-type {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--brand);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .card-item .card-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    color: var(--text);
  }

  .card-item .card-price {
    font-size: 36px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    margin: 16px 0 8px;
    letter-spacing: -0.02em;
  }

  .card-item .card-price span {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .card-item .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .card-item .btn-buy {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    padding: 9px 22px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.4s var(--ease-spring);
    box-shadow: 0 2px 8px rgba(37,99,235,0.15);
  }

  .card-item .btn-buy:hover {
    background: var(--brand-hover);
    box-shadow: 0 6px 24px rgba(37,99,235,0.28);
    transform: translateY(-1px);
  }

  .card-item .btn-buy:active { transform: scale(0.95); transition: all 0.1s var(--ease-out-expo); }

  /* ===== 我的健身卡（层叠效果） ===== */
  .my-cards-stack {
    position: relative;
    margin-bottom: 32px;
  }

  .my-card {
    border-radius: var(--radius);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .my-card.card-active {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: #FFFFFF;
    box-shadow: 0 4px 20px rgba(37,99,235,0.2);
    position: relative;
    z-index: 2;
  }

  .my-card.card-active:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(37,99,235,0.3);
  }

  .my-card.card-expired {
    background: #F1F5F9;
    opacity: 0.6;
    z-index: 1;
  }

  .my-card .mc-name { font-weight: 600; font-size: 14px; }
  .card-active .mc-name { color: #FFFFFF; }
  .card-expired .mc-name { color: var(--text); }

  .my-card .mc-date { font-size: 12px; margin-top: 2px; }
  .card-active .mc-date { color: rgba(255,255,255,0.6); }
  .card-expired .mc-date { color: var(--text-muted); }

  .mc-status {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .mc-status svg { width: 12px; height: 12px; }

  .status-active {
    background: rgba(255,255,255,0.15);
    color: #FFFFFF;
  }

  .status-expired {
    background: var(--danger-bg);
    color: #DC2626;
    border: 1px solid #FECACA;
  }

  /* ===== 教练卡片 ===== */
  .coach-card {
    background: var(--surface);
    border: 1px solid rgba(37,99,235,0.05);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.5s var(--ease-spring);
    box-shadow: var(--shadow-sm);
    position: relative;
  }

  .coach-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }

  .coach-avatar {
    width: 100%;
    aspect-ratio: 3/4;
    background: #F3F4F6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .coach-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .coach-avatar svg { width: 42px; height: 42px; color: var(--text-muted); opacity: 0.35; }

  /* 底部渐变遮罩 + 文字覆盖 */
  .coach-avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 50%);
    pointer-events: none;
  }

  .coach-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px;
    z-index: 1;
    color: #FFFFFF;
  }

  .coach-overlay .coach-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .coach-overlay .coach-spec {
    font-size: 12px;
    font-weight: 600;
    margin-top: 4px;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .coach-info { padding: 14px 18px; }
  .coach-info .coach-intro { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  /* ===== 统计盒子 ===== */
  .stat-box {
    background: var(--surface);
    border: 1px solid rgba(37,99,235,0.06);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    transition: all 0.5s var(--ease-spring);
    box-shadow: var(--shadow-sm);
  }

  .stat-box:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .stat-box .stat-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }

  .stat-box .stat-icon svg { width: 24px; height: 24px; }

  .stat-icon-orange { background: rgba(37,99,235,0.08); color: var(--brand); }
  .stat-icon-blue { background: var(--blue-bg); color: var(--blue); }

  .stat-box .stat-num {
    font-size: 48px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .stat-box .stat-label {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-weight: 500;
  }

  .stat-box .stat-sub {
    font-size: 12px;
    margin-top: 10px;
    padding: 5px 12px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
  }

  .stat-sub.good { background: var(--green-bg); color: #059669; }
  .stat-sub.warn { background: var(--warning-bg); color: #D97706; }
  .stat-sub.busy { background: var(--danger-bg); color: #DC2626; }

  /* ===== 新闻列表 ===== */
  .news-item {
    background: var(--surface);
    border: 1px solid rgba(37,99,235,0.05);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.4s var(--ease-spring);
    display: flex;
    gap: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .news-item:hover {
    border-color: rgba(37,99,235,0.15);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .news-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--brand);
    border-radius: 0 3px 3px 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .news-item:hover::before { opacity: 1; }

  .news-date {
    flex-shrink: 0;
    width: 50px;
    text-align: center;
    background: #FAFAFA;
    border-radius: 8px;
    padding: 8px 4px;
    border: 1px solid var(--border-light);
  }

  .news-date .day {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .news-date .month {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    text-transform: uppercase;
  }

  .news-item .news-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .news-item .news-preview { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .news-dot {
    width: 8px; height: 8px;
    background: var(--brand);
    border-radius: 50%;
    position: absolute;
    top: 18px; right: 18px;
  }

  /* ===== 商品卡片 ===== */
  .product-card {
    background: var(--surface);
    border: 1px solid rgba(37,99,235,0.05);
    border-radius: var(--radius);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: all 0.5s var(--ease-spring);
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .product-card.low-stock {
    border-left: 3px solid #EF4444;
  }

  .product-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }

  .product-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    flex-shrink: 0;
    background: var(--blue-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(59,130,246,0.1);
  }

  .product-icon svg { width: 22px; height: 22px; color: var(--blue); }
  .product-info { flex: 1; }

  .product-info .prod-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .product-info .prod-stock {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .product-info .prod-stock.low { color: #DC2626; font-weight: 600; }

  .product-price {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .btn-buy-sm {
    padding: 7px 16px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.4s var(--ease-spring);
    flex-shrink: 0;
  }

  .btn-buy-sm:hover {
    background: var(--brand-hover);
    box-shadow: 0 6px 20px rgba(37,99,235,0.25);
    transform: translateY(-1px);
  }

  .btn-buy-sm:active { transform: scale(0.95); transition: all 0.1s var(--ease-out-expo); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 520px;
    width: 92%;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: scaleIn 0.25s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.94) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal .close-btn {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .modal .close-btn:hover { background: #F3F4F6; color: var(--text); }
  .modal h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

  /* 弹窗内表单 */
  .modal .form-group { margin-bottom: 18px; }
  .modal .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .modal .form-group input { width: 100%; padding: 11px 14px; background: #F8FAFC; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color 0.2s; }
  .modal .form-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
  .modal .btn-primary { width: 100%; padding: 12px; background: var(--brand); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.3s var(--ease-spring); }
  .modal .btn-primary:hover { background: var(--brand-hover); box-shadow: 0 4px 16px rgba(37,99,235,0.2); }
  .modal .btn-primary:active { transform: scale(0.97); }
  .modal .msg { font-size: 13px; padding: 10px 14px; border-radius: var(--radius-sm); display: none; align-items: center; gap: 8px; font-weight: 500; }
  .modal .msg.show { display: flex; }
  .modal .msg-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
  .modal .msg-success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }

  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-state svg { width: 48px; height: 48px; opacity: 0.25; margin-bottom: 14px; }

  /* ===== 峰值日历 ===== */
  .peak-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-header {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 6px 0;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    transition: transform 0.2s ease;
    cursor: default;
  }

  .cal-day:hover { transform: scale(1.15); z-index: 1; }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.empty:hover { transform: none; }
  .cal-day .cal-num { font-size: 12px; }
  .cal-day .cal-peak { font-size: 10px; color: var(--text-muted); }

  .cal-heat-0 { background: #F1F5F9; color: var(--text-muted); }
  .cal-heat-1 { background: #DBEAFE; color: #1E40AF; }
  .cal-heat-2 { background: #93C5FD; color: #1E3A5F; }
  .cal-heat-3 { background: #3B82F6; color: #FFFFFF; }
  .cal-heat-4 { background: #1D4ED8; color: #FFFFFF; }

  /* 时间段柱状条 */
  .timeslot-bars { display: flex; gap: 10px; align-items: flex-end; }
  .ts-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ts-bar-fill { width: 100%; max-width: 56px; background: linear-gradient(180deg, var(--brand), #93C5FD); border-radius: 6px 6px 0 0; min-height: 4px; transition: height 0.6s ease; }
  .ts-bar-num { font-size: 14px; font-weight: 700; color: var(--text); }
  .ts-bar-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  /* ===== 新闻跑马灯 ===== */
  .news-ticker {
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    border-bottom: 1px solid rgba(37,99,235,0.1);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
    height: 42px;
  }

  .ticker-icon {
    flex-shrink: 0;
    color: var(--brand);
    display: flex;
    align-items: center;
  }

  .ticker-track {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .ticker-text {
    display: inline-block;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    color: #1E40AF;
    animation: tickerScroll 18s linear infinite;
  }

  @keyframes tickerScroll {
    0%   { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>

<script>
const API = '';
let user = null;

(async function init() {
  try {
    const res = await fetch(API + '/api/auth/me');
    const data = await res.json();
    if (data.code !== 200) { window.location.href = '/login.html'; return; }
    user = data.data;
    document.getElementById('sidebarUsername').textContent = user.username;
    if (user.photo) {
      document.getElementById('sidebarAvatar').innerHTML = '<img src="'+user.photo+'" style="width:32px;height:32px;border-radius:8px;object-fit:cover;">';
    } else {
      document.getElementById('sidebarAvatarLetter').textContent = (user.username||'M').charAt(0).toUpperCase();
    }
    document.getElementById('sidebarVip').textContent = user.vipCardNo ? 'VIP ' + user.vipCardNo : '普通会员';
    document.getElementById('headerVip').textContent = user.vipCardNo ? 'VIP ' + user.vipCardNo : '普通会员';
    loadCards();
    loadTicker();
  } catch (e) { window.location.href = '/login.html'; }
})();

async function loadTicker() {
  try {
    const r = await fetch(API + '/api/news/ticker');
    const d = await r.json();
    if (d.code === 200 && d.data) {
      const ticker = document.getElementById('newsTicker');
      document.getElementById('tickerText').textContent = d.data.title + '：' + d.data.content;
      ticker.style.display = 'flex';
    }
  } catch (e) {}
}

const PAGE_TITLES = {
  cards: '健身卡',
  coaches: '教练团队',
  'gym-status': '场馆实时状态',
  news: '通知公告',
  body: '身体数据',
  shop: '商品购买'
};

function switchPage(pageName) {
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`[data-page="${pageName}"]`).classList.add('active');
  document.getElementById('page-' + pageName).classList.add('active');
  document.getElementById('breadcrumb').innerHTML = (PAGE_TITLES[pageName] || pageName) + ' <span>/ 会员中心</span>';
  if (pageName === 'cards') loadCards();
  else if (pageName === 'coaches') loadCoaches();
  else if (pageName === 'gym-status') loadGymStatus();
  else if (pageName === 'news') loadNews();
  else if (pageName === 'body') loadBodyPage();
  else if (pageName === 'shop') loadShop();
}

async function loadCards() {
  try {
    const res = await fetch(API + '/api/card/my');
    const data = await res.json();
    const c = document.getElementById('myCards');
    if (data.code === 200 && data.data.length > 0) {
      c.innerHTML = '<div class="my-cards-stack">'+data.data.map(c => {
        const ok = c.status === 1 && new Date(c.expireTime) > new Date();
        return `<div class="my-card ${ok?'card-active':'card-expired'}"><div><div class="mc-name">${c.cardName}</div><div class="mc-date">${formatDate(c.buyTime)} — 到期: ${formatDate(c.expireTime)}</div></div><span class="mc-status ${ok?'status-active':'status-expired'}">${ok?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>有效':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>已过期'}</span></div>`;
      }).join('')+'</div>';
    } else { c.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/></svg><p>暂未购买健身卡</p></div>'; }
  } catch (e) { document.getElementById('myCards').innerHTML = '<div class="empty-state"><p>加载失败</p></div>'; }

  try {
    const res = await fetch(API + '/api/card/types');
    const data = await res.json();
    if (data.code === 200) {
      const colors = ['gold', 'orange', 'blue', 'green'];
      document.getElementById('cardTypes').innerHTML = data.data.map((c, i) => `
        <div class="card-item ${colors[i%4]}">
          ${i === 2 ? '<div class="card-badge badge-hot">🔥 热门</div>' : ''}
          ${i === 0 ? '<div class="card-badge badge-value">超值</div>' : ''}
          <div class="card-type">${c.type}</div>
          <div class="card-name">${c.name}</div>
          <div class="card-price">&yen;${c.price}<span>/${c.durationDays}天</span></div>
          <div class="card-desc">${c.description || ''}</div>

async function loadGymStatus() {
  try {
    const res = await fetch(API + '/api/gym/count');
    const data = await res.json();
    if (data.code === 200) {
      const cnt = data.data.currentCount;
      document.getElementById('gymCount').textContent = cnt;
      document.getElementById('gymTotalIn').textContent = data.data.totalIn;
      const lv = document.getElementById('gymLevel');
      if (cnt < 20) { lv.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 空闲 · 快来锻炼'; lv.className = 'stat-sub good'; }
      else if (cnt < 50) { lv.innerHTML = '适中'; lv.className = 'stat-sub warn'; }
      else { lv.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="10.29 3.86 1.82 18 20.35 18 10.29 3.86"/></svg> 拥挤 · 建议错峰'; lv.className = 'stat-sub busy'; }
    }
  } catch (e) {}
  // 加载峰值日历
  try {
    const cr = await fetch(API + '/api/gym/daily-peaks');
    const cd = await cr.json();
    if (cd.code === 200) {
      const { year, month, records } = cd.data;
      document.getElementById('calMonthLabel2').textContent = year + '年' + month + '月';
      const peakMap = {};
      if (records) records.forEach(r => { peakMap[r.recordDate] = r.peakCount || 0; });
      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const weekHeaders = ['日','一','二','三','四','五','六'];
      let html = weekHeaders.map(d => '<div class="cal-header">'+d+'</div>').join('');
      for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const peak = peakMap[ds] || 0;
        let hc = 'cal-heat-0';
        if (peak >= 50) hc = 'cal-heat-4';
        else if (peak >= 30) hc = 'cal-heat-3';
        else if (peak >= 15) hc = 'cal-heat-2';
        else if (peak > 0) hc = 'cal-heat-1';
        html += '<div class="cal-day '+hc+'" title="点击查看'+ds+'时段详情" onclick="showDayDetail2(\''+ds+'\')" style="cursor:pointer;"><span class="cal-num">'+d+'</span><span class="cal-peak">'+(peak>0?peak:'')+'</span></div>';
      }
      document.getElementById('peakCalendar2').innerHTML = html;
    }
  } catch (e) {}
  // 时间段峰值
  try {
    const tr = await fetch(API + '/api/gym/timeslots');
    const td = await tr.json();
    if (td.code === 200) {
      const slots = ['8:00-10:00','10:00-12:00','12:00-14:00','14:00-16:00','16:00-20:00','20:00-22:00'];
      const data = td.data.slots || td.data;
      const values = slots.map(s => data[s] || 0);
      const max = Math.max(1, ...values);
      document.getElementById('timeslotBars2').innerHTML = slots.map((s, i) =>
        '<div class="ts-bar-wrap"><div class="ts-bar-num">'+values[i]+'</div>'+
        '<div class="ts-bar-fill" style="height:'+Math.max(4,Math.round(values[i]/max*100))+'px"></div>'+
        '<div class="ts-bar-label">'+s+'</div></div>'
      ).join('');
    }
  } catch (e) {}
}

function formatDate(d) {

  const dt = new Date(d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');

      <div id="pwdMsg" class="msg" style="margin-bottom:14px;"></div>

async function doChangePwd() {
  const oldPwd = document.getElementById('oldPwd').value.trim();
  const newPwd = document.getElementById('newPwd').value.trim();
  const confirmPwd = document.getElementById('confirmPwd').value.trim();
  const msgEl = document.getElementById('pwdMsg');
  msgEl.className = 'msg'; msgEl.style.display = 'none';
  if (!oldPwd || !newPwd) { msgEl.className = 'msg msg-error show'; msgEl.textContent = '请填写所有字段'; return; }
  if (newPwd.length < 6) { msgEl.className = 'msg msg-error show'; msgEl.textContent = '新密码至少6位'; return; }
  if (newPwd !== confirmPwd) { msgEl.className = 'msg msg-error show'; msgEl.textContent = '两次输入的新密码不一致'; return; }
  try {
    const r = await fetch(API + '/api/auth/change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
    });
    const d = await r.json();
    if (d.code === 200) {
      msgEl.className = 'msg msg-success show'; msgEl.textContent = '密码修改成功';
      setTimeout(() => { document.getElementById('modalOverlay').classList.remove('show'); }, 1200);
    } else {
      msgEl.className = 'msg msg-error show'; msgEl.textContent = d.message;
    }
  } catch (e) { msgEl.className = 'msg msg-error show'; msgEl.textContent = '网络错误'; }
}

let bodyChart = null;

function getBmiLevel(bmi) {
  if (bmi < 18.5) return { text: '偏瘦', cls: 'warn' };
  if (bmi < 24) return { text: '正常', cls: 'good' };
  if (bmi < 28) return { text: '偏胖', cls: 'warn' };
  return { text: '肥胖', cls: 'busy' };
}

function getBodyFatLevel(bf, gender) {
  if (gender === 1) {
    if (bf < 10) return { text: '偏低', cls: 'warn' };
    if (bf < 20) return { text: '标准', cls: 'good' };
    if (bf < 25) return { text: '偏高', cls: 'warn' };
    return { text: '肥胖', cls: 'busy' };
  } else {
    if (bf < 18) return { text: '偏低', cls: 'warn' };
    if (bf < 28) return { text: '标准', cls: 'good' };
    if (bf < 35) return { text: '偏高', cls: 'warn' };
    return { text: '肥胖', cls: 'busy' };
  }
}

function drawBodyChart(list) {
  const ctx = document.getElementById('bodyChart').getContext('2d');
  if (bodyChart) bodyChart.destroy();

  // 反转使最早的在左边
  const reversed = [...list].reverse();
  const labels = reversed.map(r => {
    const d = new Date(r.recordTime);
    return (d.getMonth()+1)+'/'+d.getDate();
  });
  const bmiData = reversed.map(r => r.bmi);
  const bfData = reversed.map(r => r.bodyFat);

  bodyChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'BMI',
          data: bmiData,
          borderColor: '#2563EB',
          backgroundColor: 'rgba(37,99,235,0.06)',
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointBackgroundColor: '#2563EB',
          borderWidth: 2.5,
          yAxisID: 'y'
        },
        {
          label: '体脂率 (%)',
          data: bfData,
          borderColor: '#F59E0B',
          backgroundColor: 'rgba(245,158,11,0.06)',
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointBackgroundColor: '#F59E0B',
          borderWidth: 2.5,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            usePointStyle: true,
            pointStyleWidth: 8,
            padding: 24,
            font: { family: "var(--font)", size: 12 },
            color: '#64748B'
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#F1F5F9' },
          ticks: { font: { size: 11 }, color: '#94A3B8' }
        },
        y: {
          type: 'linear',
          position: 'left',
          title: { display: true, text: 'BMI', color: '#2563EB', font: { weight: 'bold', size: 12 } },
          grid: { color: '#F1F5F9' },
          ticks: { font: { size: 11 }, color: '#94A3B8' }
        },
        y1: {
          type: 'linear',
          position: 'right',
          title: { display: true, text: '体脂率 (%)', color: '#F59E0B', font: { weight: 'bold', size: 12 } },
          grid: { drawOnChartArea: false },
          ticks: { font: { size: 11 }, color: '#94A3B8' }
        }
      }
    }
  });
}

async function saveBody() {
  const height = document.getElementById('bodyHeight').value.trim();
  const weight = document.getElementById('bodyWeight').value.trim();
  const age = document.getElementById('bodyAge').value.trim();
  const genderEl = document.querySelector('input[name="bodyGender"]:checked');
  const gender = genderEl ? genderEl.value : '1';

  if (!height || !weight || !age) {
    alert('请填写身高、体重和年龄');
    return;
  }
  if (parseFloat(height) <= 0 || parseFloat(weight) <= 0) {
    alert('身高和体重必须大于0');
    return;
  }

  try {
    const res = await fetch(API + '/api/body/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ height, weight, gender, age })
    });
    const data = await res.json();
    if (data.code === 200) {
      alert('保存成功！');
      document.getElementById('bodyHeight').value = '';
      document.getElementById('bodyWeight').value = '';
      document.getElementById('bodyAge').value = '';
      loadBodyPage();
    } else {
      alert('保存失败: ' + data.message);
    }
  } catch (e) {
    alert('网络错误');
  }
}
