<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFit - 登录</title>
<meta name="author" content="Jelly">
<style>
  :root {
    --brand: #2563EB;
    --brand-hover: #1D4ED8;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --bg: #F8FAFC;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  /* ========== 左侧轮播区 ========== */
  .carousel {
    flex: 1;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }

  .carousel-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    z-index: 0;
  }
  .carousel-slide.active { opacity: 1; z-index: 1; }

  /* 图片来源 */
  .slide-1 { background-image: url('/l1.jpg'); }
  .slide-2 { background-image: url('/l2.jpg'); }
  .slide-3 { background-image: url('/l3.jpg'); }

  .carousel::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.65) 100%);
    z-index: 2;
  }

  .carousel-brand {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    text-align: center;
    color: #fff;
  }
  .carousel-brand .brand-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .carousel-brand .brand-icon svg { width: 30px; height: 30px; color: #fff; }
  .carousel-brand h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
  .carousel-brand h1 em { font-style: normal; color: #93C5FD; }
  .carousel-brand .tagline { font-size: 13px; color: #cbd5e1; margin-top: 6px; letter-spacing: 0.1em; }

  /* 圆点指示器 */
  .carousel-dots {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    gap: 8px;
  }
  .carousel-dots .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .carousel-dots .dot.active {
    background: #fff;
    width: 24px;
    border-radius: 4px;
  }

  /* ========== 右侧表单区 ========== */
  .form-side {
    width: 440px;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: -4px 0 40px rgba(0,0,0,0.08);
  }

  .form-side-inner {
    animation: formEnter 0.8s var(--ease-out-expo) 0.2s both;
  }

  @keyframes formEnter {
    from { opacity: 0; transform: translateX(24px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Brand small */
  .brand-sm { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-sm-icon {
    width: 36px; height: 36px;
    background: var(--brand);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-sm-icon svg { width: 20px; height: 20px; color: #fff; }
  .brand-sm-text { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-sm-text em { font-style: normal; color: var(--brand); }

  /* Tabs */
  .tabs { display: flex; margin-bottom: 26px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px 14px;
    cursor: pointer; color: var(--text-muted); font-size: 15px; font-weight: 600;
    background: none; border: none; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.3s var(--ease-out-expo);
    font-family: var(--font);
  }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .tab:hover:not(.active) { color: var(--text-secondary); }

  /* Form */
  .form-panel { display: none; }
  .form-panel.active { display: block; animation: in 0.5s var(--ease-out-expo); }

  @keyframes in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
  .form-group input[type="text"],
  .form-group input[type="password"] {
    width: 100%; padding: 12px 15px;
    background: #F8FAFC; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: var(--font); color: var(--text); outline: none;
    transition: all 0.35s var(--ease-out-expo);
  }
  .form-group input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08), 0 0 0 1px rgba(37,99,235,0.2);
    background: #FFFFFF;
  }
  .form-group input::placeholder { color: #CBD5E1; }

  .file-input {
    width: 100%; padding: 11px 14px;
    background: #F8FAFC; border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; font-family: var(--font); color: var(--text-secondary);
    cursor: pointer; transition: all 0.3s var(--ease-out-expo);
  }
  .file-input:hover { border-color: var(--brand); }

  .btn {
    width: 100%; padding: 13px 24px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
    transition: all 0.4s var(--ease-spring);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--brand); color: #fff;
    box-shadow: 0 2px 8px rgba(37,99,235,0.18);
  }
  .btn-primary:hover {
    background: var(--brand-hover);
    box-shadow: 0 4px 20px rgba(37,99,235,0.28), 0 0 0 4px rgba(37,99,235,0.06);
    transform: translateY(-1px);
  }

  .msg {
    font-size: 13px; padding: 10px 14px; border-radius: 10px;
    margin-bottom: 16px; display: none; align-items: center; gap: 8px; font-weight: 500;
  }
  .msg.show { display: flex; }
  .msg-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
  .msg-success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
  .msg svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .carousel { display: none; }
    .form-side { width: 100%; padding: 40px 28px; }
    .form-side-inner { animation: none; }
  }
</style>
</head>
<body>

<!-- 左侧轮播 -->
<div class="carousel">
  <div class="carousel-slide slide-1 active" id="slide1"></div>
  <div class="carousel-slide slide-2" id="slide2"></div>
  <div class="carousel-slide slide-3" id="slide3"></div>

  <div class="carousel-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5h11M6.5 6.5a4 4 0 0 0-4 4v3a4 4 0 0 0 4 4h11a4 4 0 0 0 4-4v-3a4 4 0 0 0-4-4"/>
        <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
        <circle cx="16" cy="13" r="1.5" fill="currentColor"/>
        <path d="M7 17.5h10"/>
      </svg>
    </div>
    <h1>Power<em>Fit</em></h1>
    <p class="tagline">智能健身房管理系统</p>
  </div>

  <div class="carousel-dots">
    <span class="dot active" onclick="goSlide(0)"></span>
    <span class="dot" onclick="goSlide(1)"></span>
    <span class="dot" onclick="goSlide(2)"></span>
  </div>
</div>

<!-- 右侧表单 -->
<div class="form-side">
  <div class="form-side-inner">
    <div class="brand-sm">
      <div class="brand-sm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11M6.5 6.5a4 4 0 0 0-4 4v3a4 4 0 0 0 4 4h11a4 4 0 0 0 4-4v-3a4 4 0 0 0-4-4"/>
          <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="13" r="1.5" fill="currentColor"/>
          <path d="M7 17.5h10"/>
        </svg>
      </div>
      <div class="brand-sm-text">Power<em>Fit</em></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登录</button>
      <button class="tab" onclick="switchTab('register')">注册</button>
    </div>

    <div id="loginPanel" class="form-panel active">
      <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="username"></div>
      <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password"></div>
      <div id="loginError" class="msg msg-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg><span></span></div>
      <button class="btn btn-primary" onclick="doLogin()">登录</button>
      <div id="loginSuccess" class="msg msg-success" style="margin-top:14px;margin-bottom:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span></span></div>
    </div>

    <div id="registerPanel" class="form-panel">
      <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="设置用户名"></div>
      <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="设置密码（至少6位）"></div>
      <div class="form-group"><label>手机号</label><input type="text" id="regPhone" placeholder="输入手机号"></div>
      <div class="form-group"><label>照片（选填）</label><input type="file" id="regPhoto" accept="image/*" class="file-input"></div>
      <div id="regError" class="msg msg-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg><span></span></div>
      <button class="btn btn-primary" onclick="doRegister()">注册</button>
      <div id="regSuccess" class="msg msg-success" style="margin-top:14px;margin-bottom:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span></span></div>
    </div>
  </div>
</div>

<script>
const API = '';

/* ===== 轮播控制器 ===== */
var carouselSlides = document.querySelectorAll('.carousel-slide');
var carouselDots = document.querySelectorAll('.carousel-dots .dot');
var currentSlide = 0;
var slideInterval;

function goSlide(index) {
  carouselSlides[currentSlide].classList.remove('active');
  carouselDots[currentSlide].classList.remove('active');
  currentSlide = index;
  carouselSlides[currentSlide].classList.add('active');
  carouselDots[currentSlide].classList.add('active');
}

function nextSlide() {
  goSlide((currentSlide + 1) % carouselSlides.length);
}

// 自动轮播 4秒/张
slideInterval = setInterval(nextSlide, 4000);

/* ===== 登录/注册逻辑（保持原有功能） ===== */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.form-panel').forEach(function(p) { p.classList.remove('active'); });
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('loginPanel').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('registerPanel').classList.add('active');
  }
}

function showMsg(el, text) { el.querySelector('span').textContent = text; el.classList.add('show'); }
function hideMsg(el) { el.classList.remove('show'); }

async function doLogin() {
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value.trim();
  var errEl = document.getElementById('loginError');
  hideMsg(errEl);
  if (!username || !password) { showMsg(errEl, '请填写用户名和密码'); return; }
  try {
    var res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, password: password }) });
    var data = await res.json();
    if (data.code === 200) { window.location.href = data.data.role === 'ADMIN' ? '/admin.html' : '/user.html'; }
    else { showMsg(errEl, data.message); }
  } catch (e) { showMsg(errEl, '网络错误，请稍后重试'); }
}

async function doRegister() {
  var username = document.getElementById('regUsername').value.trim();
  var password = document.getElementById('regPassword').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  var errEl = document.getElementById('regError'), sucEl = document.getElementById('regSuccess');
  hideMsg(errEl); hideMsg(sucEl);
  if (!username || !password || !phone) { showMsg(errEl, '请填写用户名、密码和手机号'); return; }
  if (password.length < 6) { showMsg(errEl, '密码至少6位'); return; }
  var photoUrl = null;
  var photoFile = document.getElementById('regPhoto').files[0];
  if (photoFile) {
    var fd = new FormData(); fd.append('file', photoFile);
    try { var upRes = await fetch(API + '/api/upload/image', { method: 'POST', body: fd }); var upData = await upRes.json(); if (upData.code === 200) photoUrl = upData.data.url; } catch (e) {}
  }
  try {
    var res = await fetch(API + '/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, password: password, phone: phone, photo: photoUrl }) });
    var data = await res.json();
    if (data.code === 200) {
      showMsg(sucEl, '注册成功，请登录后购买健身卡获取VIP卡号');
      document.getElementById('regUsername').value = ''; document.getElementById('regPassword').value = ''; document.getElementById('regPhone').value = ''; document.getElementById('regPhoto').value = '';
    } else { showMsg(errEl, data.message); }
  } catch (e) { showMsg(errEl, '网络错误，请稍后重试'); }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('loginPanel').classList.contains('active') ? doLogin() : doRegister();
  }
});
</script>
</body>
</html>
