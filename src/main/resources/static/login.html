<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFit - 登录</title>
<meta name="author" content="Jelly">
<style>
  :root {
    --brand: #2563EB;
    --brand-hover: #1D4ED8;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --bg: #F8FAFC;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-wrapper {
    width: 100%;
    max-width: 420px;
    animation: cardEnter 0.9s var(--ease-out-expo);
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(24px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* Brand */
  .brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .brand-icon {
    width: 44px; height: 44px;
    background: var(--brand);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .brand-icon svg { width: 24px; height: 24px; color: #fff; }

  .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .brand h1 em { font-style: normal; color: var(--brand); }
  .brand .sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

  /* ===== Double-Bezel 卡片 ===== */
  .card-shell {
    background: rgba(37,99,235,0.04);
    border: 1px solid rgba(37,99,235,0.08);
    border-radius: 20px;
    padding: 5px;
    box-shadow:
      0 1px 2px rgba(37,99,235,0.04),
      0 8px 32px rgba(37,99,235,0.06);
  }

  .card-core {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  }

  /* Tabs */
  .tabs {
    display: flex;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 8px 14px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 600;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.3s var(--ease-out-expo);
    font-family: var(--font);
  }

  .tab.active {
    color: var(--brand);
    border-bottom-color: var(--brand);
  }

  .tab:hover:not(.active) { color: var(--text-secondary); }

  /* Form */
  .form-panel { display: none; }
  .form-panel.active { display: block; animation: in 0.5s var(--ease-out-expo); }

  @keyframes in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-group { margin-bottom: 22px; }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .form-group input[type="text"],
  .form-group input[type="password"] {
    width: 100%;
    padding: 13px 16px;
    background: #F8FAFC;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: all 0.35s var(--ease-out-expo);
  }

  .form-group input:focus {
    border-color: var(--brand);
    box-shadow:
      0 0 0 3px rgba(37,99,235,0.08),
      0 0 0 1px rgba(37,99,235,0.2);
    background: #FFFFFF;
  }

  .form-group input::placeholder { color: #CBD5E1; }

  .file-input {
    width: 100%;
    padding: 12px 14px;
    background: #F8FAFC;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s var(--ease-out-expo);
  }

  .file-input:hover { border-color: var(--brand); }

  /* ===== Button-in-Button ===== */
  .btn {
    width: 100%;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.5s var(--ease-spring);
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--brand);
    color: #fff;
    box-shadow:
      0 2px 8px rgba(37,99,235,0.18),
      0 0 0 0 rgba(37,99,235,0);
  }

  .btn-primary:hover {
    background: var(--brand-hover);
    box-shadow:
      0 4px 20px rgba(37,99,235,0.28),
      0 0 0 4px rgba(37,99,235,0.06);
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: scale(0.97) translateY(0);
    transition: all 0.1s var(--ease-out-expo);
  }

  /* Message */
  .msg {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  .msg.show { display: flex; }
  .msg-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
  .msg-success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
  .msg svg { width: 16px; height: 16px; flex-shrink: 0; }

  .footer-text {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 28px;
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5h11M6.5 6.5a4 4 0 0 0-4 4v3a4 4 0 0 0 4 4h11a4 4 0 0 0 4-4v-3a4 4 0 0 0-4-4"/>
        <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
        <circle cx="16" cy="13" r="1.5" fill="currentColor"/>
        <path d="M7 17.5h10"/>
      </svg>
    </div>
    <h1>Power<em>Fit</em></h1>
    <p class="sub">智能健身房管理系统</p>
  </div>

  <!-- Double-Bezel 卡片 -->
  <div class="card-shell">
    <div class="card-core">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">登录</button>
        <button class="tab" onclick="switchTab('register')">注册</button>
      </div>

      <div id="loginPanel" class="form-panel active">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
        </div>
        <div id="loginError" class="msg msg-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span></span>
        </div>
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
        <div id="loginSuccess" class="msg msg-success" style="margin-top:14px;margin-bottom:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span></span>
        </div>
      </div>

      <div id="registerPanel" class="form-panel">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="设置用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="设置密码（至少6位）">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="text" id="regPhone" placeholder="输入手机号">
        </div>
        <div class="form-group">
          <label>照片（选填）</label>
          <input type="file" id="regPhoto" accept="image/*" class="file-input">
        </div>
        <div id="regError" class="msg msg-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span></span>
        </div>
        <button class="btn btn-primary" onclick="doRegister()">注册</button>
        <div id="regSuccess" class="msg msg-success" style="margin-top:14px;margin-bottom:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <p class="footer-text">PowerFit Gym Management System</p>
</div>

<script>
const API = '';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  if (tab === 'login') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('loginPanel').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('registerPanel').classList.add('active');
  }
}

function showMsg(el, text) { el.querySelector('span').textContent = text; el.classList.add('show'); }
function hideMsg(el) { el.classList.remove('show'); }

async function doLogin() {
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value.trim();
  var errEl = document.getElementById('loginError');
  hideMsg(errEl);
  if (!username || !password) { showMsg(errEl, '请填写用户名和密码'); return; }
  try {
    var res = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    });
    var data = await res.json();
    if (data.code === 200) {
      window.location.href = data.data.role === 'ADMIN' ? '/admin.html' : '/user.html';
    } else { showMsg(errEl, data.message); }
  } catch (e) { showMsg(errEl, '网络错误，请稍后重试'); }
}

async function doRegister() {
  var username = document.getElementById('regUsername').value.trim();
  var password = document.getElementById('regPassword').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  var errEl = document.getElementById('regError'), sucEl = document.getElementById('regSuccess');
  hideMsg(errEl); hideMsg(sucEl);
  if (!username || !password || !phone) { showMsg(errEl, '请填写用户名、密码和手机号'); return; }
  if (password.length < 6) { showMsg(errEl, '密码至少6位'); return; }
  var photoUrl = null;
  var photoFile = document.getElementById('regPhoto').files[0];
  if (photoFile) {
    var fd = new FormData();
    fd.append('file', photoFile);
    try {
      var upRes = await fetch(API + '/api/upload/image', { method: 'POST', body: fd });
      var upData = await upRes.json();
      if (upData.code === 200) photoUrl = upData.data.url;
    } catch (e) {}
  }
  try {
    var res = await fetch(API + '/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password, phone: phone, photo: photoUrl })
    });
    var data = await res.json();
    if (data.code === 200) {
      showMsg(sucEl, '注册成功，请登录后购买健身卡获取VIP卡号');
      document.getElementById('regUsername').value = '';
      document.getElementById('regPassword').value = '';
      document.getElementById('regPhone').value = '';
      document.getElementById('regPhoto').value = '';
    } else { showMsg(errEl, data.message); }
  } catch (e) { showMsg(errEl, '网络错误，请稍后重试'); }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    document.getElementById('loginPanel').classList.contains('active') ? doLogin() : doRegister();
  }
});
</script>
</body>
</html>
