<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFit - 健身房管理系统</title>
<meta name="author" content="Jelly">
<style>
  :root {
    --brand: #2563EB;
    --text: #1F2937;
    --text-muted: #9CA3AF;
    --bg: #F8F9FA;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .splash {
    text-align: center;
    animation: fadeOut 0.5s ease 1.2s both;
  }

  @keyframes fadeOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.96); }
  }

  .logo-wrap {
    width: 88px; height: 88px; margin: 0 auto 28px;
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 48px rgba(37,99,235,0.3);
    animation: logoBeat 2.5s cubic-bezier(0.16,1,0.3,1) infinite;
  }

  @keyframes logoBeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.06); }
    28% { transform: scale(1); }
    42% { transform: scale(1.04); }
    70% { transform: scale(1); }
  }

  .logo-wrap svg { width: 48px; height: 48px; color: #fff; }

  .brand-text {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .brand-text em {
    font-style: normal;
    color: #2563EB;
  }

  .tagline {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 8px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .loader {
    margin-top: 36px;
    width: 180px;
    height: 3px;
    background: #E5E7EB;
    border-radius: 3px;
    margin-left: auto;
    margin-right: auto;
    overflow: hidden;
  }

  .loader-bar {
    height: 100%;
    width: 0%;
    background: var(--brand);
    border-radius: 3px;
    animation: load 1.3s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes load { from { width: 0%; } to { width: 100%; } }

  .meta {
    position: fixed;
    bottom: 32px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    width: 100%;
    letter-spacing: 0.04em;
    animation: fadeOut 0.5s ease 1.2s both;
  }
</style>
<meta http-equiv="refresh" content="1.6;url=/login.html">
</head>
<body>

<div class="splash">
  <div class="logo-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M6.5 6.5h11M6.5 6.5a4 4 0 0 0-4 4v3a4 4 0 0 0 4 4h11a4 4 0 0 0 4-4v-3a4 4 0 0 0-4-4"/>
      <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
      <circle cx="16" cy="13" r="1.5" fill="currentColor"/>
      <path d="M7 17.5h10"/>
    </svg>
  </div>
  <div class="brand-text">Power<em>Fit</em></div>
  <p class="tagline">智能健身房管理系统</p>
  <div class="loader"><div class="loader-bar"></div></div>
</div>

<div class="meta">POWERFIT GYM MANAGEMENT SYSTEM</div>

</body>
</html>
